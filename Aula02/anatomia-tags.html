<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomia das tags para html</title>

</head>
<body>
    <h1>Anatomia das tags</h1>
    <p>
        As tags em html são os elementos básicos
        que compõe uma página web. Cada tag
        tem uma estrutura especifica que desempenha um papel importante 
        na organização e apresentação do conteúdo.
    </p>
    <p>
        Este é um exemplo que pode parágrafo que pode conter
         <strong>texto em negrito</strong> ou <em>texto em italico.</em> 
    </p>
</body>
</html>
