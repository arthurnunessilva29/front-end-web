<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
     <h1>Elementos Tabela</h1>
    <p> 
        As tabela são usadas para organizar dados em linhas e colunas.
    </p>
    <br> <!--Quebra de linha-->
    <hr color = "purple"> <!--Cria uma linha horizontal-->
    <br>
    <table border = "3">
        <thead>
            <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Cidade</th>
            </tr>
        </thead>
    
        <tbody>
            <tr>
                <td>João</td>
                <td>25</td>
                <td>São Paulo</td>
            </tr>
        </tbody>
    </table>
    <img src="img/linux.jpeg"
</body>
</html>
