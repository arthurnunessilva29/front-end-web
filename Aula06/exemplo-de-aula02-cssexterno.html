<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de Classes em CSS</title>
   <style>
    .titulo{
        color: black;
        text-align: center;
    }
    .caixa01{
        background-color: rgb(8, 99, 99);
        border: 2px solid lightcyan;
        padding: 20px;
        margin: 20px;
    }
    .caixa02{
        background-color: rgb(4, 104, 104);
        border: 2px solid rgb(4, 104, 104);
        padding: 20px;
        margin: 20px;
    }
    .paragrafo1{
        color:rgb(0, 0, 0);
        font-weight: bold;

    }
    .paragrafo2{
        color:rgb(0, 0, 0);
        background-color: rgb(26, 129, 129);
        font-style: oblique;
        padding: 10px;
    }




   </style>

</head>
<body>

    <h1 class="titulo">Aprendendo sobre Classes com CSS</h1>

    <div class="caixa01">
        <p class="paragrafo1">Este é o primeiro parágrafo da primeira div.</p>
        <p class="paragrafo2">Este é o segundo parágrafo da primeira div.</p>
    </div>

    <div class="caixa02">
        <p>Este é o único parágrafo localizado dentro da segunda div.</p>
    </div>

</body>
</html>
