<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos de lista</title>
</head>
<body>
    <h1>Elementos de lista</h1>
    <p>
        As listas são utilizadas para organizar informações em uma sequência.
    </p>
    <h2>Lista Não ordenada</h2>

    <ul>
        <li>item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ul>
    <h2>Lista ordenada</h2>
    <ol>
        <li>Pirmeiro item</li>
        <li>Segundo Item</li>
        <li>Terceiro Item</li>
        <li>Quarto Item</li>
    </ol>
</body>
</html>
